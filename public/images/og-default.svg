<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background: cream (#faf8f5) -->
  <rect width="1200" height="630" fill="#faf8f5"/>

  <!-- Geometric dot texture (subtle) -->
  <defs>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#e8e2d8" opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Radial gradient accent: primary at upper right -->
  <defs>
    <radialGradient id="accent-grad" cx="90%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#18d8eb" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#faf8f5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#accent-grad)"/>

  <!-- Primary accent bar left -->
  <rect x="0" y="0" width="6" height="630" fill="#18d8eb"/>

  <!-- Company name — Poppins extrabold approximated with font-weight 800 -->
  <text
    x="100"
    y="280"
    font-family="Poppins, Arial, sans-serif"
    font-size="72"
    font-weight="800"
    fill="#1a1a2e"
    letter-spacing="-1"
  >Blue Wave Horizon</text>

  <!-- Tagline -->
  <text
    x="100"
    y="350"
    font-family="Nunito, Arial, sans-serif"
    font-size="32"
    font-weight="400"
    fill="#3d3d52"
  >Software Product Lab · Uyo, Nigeria</text>

  <!-- Divider line -->
  <rect x="100" y="388" width="120" height="4" rx="2" fill="#18d8eb"/>

  <!-- Products line -->
  <text
    x="100"
    y="450"
    font-family="Nunito, Arial, sans-serif"
    font-size="26"
    font-weight="600"
    fill="#7a7a8c"
  >Dwellr · Velopad</text>

  <!-- Secondary colour block bottom-right -->
  <rect x="900" y="470" width="300" height="160" rx="16" fill="#0a718d" opacity="0.08"/>
  <text
    x="950"
    y="555"
    font-family="Poppins, Arial, sans-serif"
    font-size="22"
    font-weight="600"
    fill="#0a718d"
  >bluewavehorizon.com</text>
</svg>
